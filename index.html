<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HW5 Candidate Verification Visualizer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body { margin: 0; padding: 20px; background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
    #canvas-holder { border: 2px solid #334155; border-radius: 8px; overflow: hidden; }
    p { max-width: 600px; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <h2>Candidate Intake vs. Deterministic Compliance Gate</h2>
  <p>Visualizing the 300+ applicant flood: Yellow dots represent incoming AI-padded submissions; the green gate deterministically admits compliant profiles, rejecting unverified records in red.</p>
  <div id="canvas-holder"></div>
  <script>
    let applicants = [];
    function setup() {
      let canvas = createCanvas(600, 360);
      canvas.parent('canvas-holder');
      for (let i = 0; i < 35; i++) {
        applicants.push({
          x: random(20, 240),
          y: random(40, 320),
          speed: random(0.8, 2.2),
          compliant: random() > 0.4
        });
      }
    }
    function draw() {
      background(15, 23, 42);
      stroke(100, 116, 139);
      line(300, 0, 300, 360);
      noStroke();
      fill(51, 65, 85);
      rect(290, 140, 20, 80, 4);
      fill(255);
      textAlign(CENTER);
      textSize(12);
      text("KNOCKOUT GATE", 300, 130);

      for (let a of applicants) {
        if (a.x < 290) {
          fill(250, 204, 21); // Inbound
          ellipse(a.x, a.y, 10, 10);
          a.x += a.speed;
        } else if (a.x >= 290 && a.x < 310) {
          a.x += a.speed;
        } else {
          if (a.compliant) {
            fill(34, 197, 94); // Eligible
            ellipse(a.x, a.y, 10, 10);
            a.x += a.speed;
          } else {
            fill(239, 68, 68); // Ineligible
            ellipse(a.x, a.y, 10, 10);
            a.y += a.speed * 1.5;
          }
        }
        if (a.x > width + 10 || a.y > height + 10) {
          a.x = random(10, 40);
          a.y = random(40, 320);
        }
      }
    }
  </script>
</body>
</html>
